<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>V8 Four-Stroke · Studio</title>
<style>
:root{--fg:#15181d;--mut:#6b7482;--card:rgba(255,255,255,.9);--line:#dfe2e8;--acc:#e0262f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#eceef1}
body{color:var(--fg);font:12px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif}
#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.card{flex:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.k{font-size:9px;letter-spacing:.09em;color:var(--mut);text-transform:uppercase;font-weight:600}
#strip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);left:6px;right:6px;display:flex;gap:6px;overflow-x:auto;align-items:flex-start}
#strip.off{display:none}
.big{font-size:34px;font-weight:800;color:var(--acc);line-height:1;font-variant-numeric:tabular-nums}
canvas.p{width:170px;height:92px;display:block;margin-top:3px}
#chips{display:grid;grid-template-columns:repeat(8,22px);gap:3px;margin-top:4px}
#chips button{padding:3px 0;border-radius:50%;height:22px;font-size:11px}
#ctl{position:absolute;left:6px;right:6px;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);display:flex;flex-direction:column;gap:5px}
.row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-weight:600;font-size:11px;letter-spacing:.04em;touch-action:manipulation;text-transform:uppercase}
button.on{background:var(--fg);color:#fff;border-color:var(--fg)}
button.red.on{background:var(--acc);border-color:var(--acc)}
label{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--mut);text-transform:uppercase;font-weight:600}
input[type=range]{width:84px;accent-color:#e0262f}
#stk{font-size:20px;font-weight:800}#chk{font-size:9px;color:var(--mut);max-width:560px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="strip">
<div class="card"><div class="k">V8 · Four-Stroke</div><div class="k" style="font-size:8px">90° cross-plane · 1-8-4-3-6-5-7-2</div><div style="margin-top:4px"><span class="big" id="rpm">2400</span> <span class="k">rev/min</span></div>
<div class="k" style="margin-top:6px">Firing order · tap to track</div><div id="chips"></div></div>
<div class="card"><div class="k" id="trk">Cylinder 1</div><div id="stk">Power</div><div><b id="pp" style="font-size:18px;color:var(--acc)">0</b> <span class="k">bar chamber pressure</span></div>
<div class="k" style="margin-top:4px">Slider-crank <span id="ang"></span></div><canvas class="p" id="sc" width="340" height="184"></canvas><div class="k" style="text-transform:none">s = r·cosθ + √(L² − r²sin²θ)</div></div>
<div class="card"><div class="k">Valve timing · drag to scrub</div><canvas class="p" id="vt" width="340" height="184" style="touch-action:none"></canvas></div>
<div class="card"><div class="k">Indicator diagram · p–V</div><canvas class="p" id="pv" width="340" height="184"></canvas></div>
<div class="card"><div class="k">Cross-plane crank · front view</div><canvas class="p" id="cp" width="340" height="184"></canvas><div id="chk" class="k" style="text-transform:none;width:170px"></div></div>
</div>
<div id="ctl">
<div class="row"><button id="pz" class="red on">Pause</button><button id="m15">−15°</button><button id="p15">+15°</button>
<label>Engine<input id="sp" type="range" min="0" max="8000" value="2400"></label>
<label>Playback 1/<b id="pbv">20</b><input id="pb" type="range" min="1" max="100" value="20"></label>
<label>Throttle<input id="th" type="range" min="0" max="1" step=".01" value=".7"></label></div>
<div class="row"><button data-v="hero" class="on">Hero</button><button data-v="front">Front</button><button data-v="side">Side</button><button data-v="valley">Valley</button><button data-v="cyl">Cyl</button>
<button data-m="glass" class="on">Glass</button><button data-m="section">Section</button><button data-m="solid">Solid</button>
<button id="chg" class="red on">Charge</button><button id="iso">Isolate</button><button id="pnl" class="on">Panels</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== MODEL: pure functions of crank angle θ (degrees, 0–720) ===== */
const D=Math.PI/180,mod=(a,n)=>((a%n)+n)%n,sm=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
const M={bore:92.5,stroke:92.9,rod:150,cr:10.5};
M.r=M.stroke/2;M.A=Math.PI/4*M.bore**2;M.Vd=M.A*M.stroke;M.Vc=M.Vd/(M.cr-1);
const ORDER=[1,8,4,3,6,5,7,2],PINS=[45,225,135,315],ZS=[-1.875,-.625,.625,1.875];
const CY=[];for(let n=1;n<=8;n++){const k=ORDER.indexOf(n),beta=(n%2?45:-45)*D,pin=beta-90*k*D,pd=Math.round(mod(pin/D,360)),zi=PINS.indexOf(pd);
CY.push({n,k,beta,pin,zi,z:ZS[zi]+(n%2?.14:-.14)});}
const xOf=a=>M.rod+M.r-(M.r*Math.cos(a)+Math.sqrt(M.rod**2-(M.r*Math.sin(a))**2));
const phase=(th,c)=>mod(th-90*c.k,720);
function pOf(ph,x,thr){const pm=.3+.7*thr,lam=1+3.3*(.4+.6*thr),V=M.Vc+M.A*x;
const pw=(x,b)=>pm*Math.pow(M.cr,1.32)*(1+(lam-1)*b)*Math.pow(M.Vc/(M.Vc+M.A*x),1.28);
if(ph<180)return pw(x,sm(ph/45));if(ph<360)return 1.1+(pw(M.stroke,1)-1.1)*Math.exp(-(ph-180)/10);
if(ph<540)return pm;return pm*Math.pow((M.Vc+M.A*M.stroke)/V,1.32);}
const lift=(ph,o,d)=>{const t=mod(ph-o,720);return t<d?Math.pow(Math.sin(Math.PI*t/d),2):0};
const IV=[350,250],EV=[130,250];
function state(th,c,thr){const psi=th*D+c.pin,a=psi-c.beta,s=M.r*Math.cos(a)+Math.sqrt(M.rod**2-(M.r*Math.sin(a))**2),x=M.rod+M.r-s,ph=phase(th,c);
return{psi,a,s,x,ph,p:pOf(ph,x,thr),iv:lift(ph,...IV),ev:lift(ph,...EV)};}
const pairs={};CY.forEach(c=>(pairs[c.zi]=pairs[c.zi]||[]).push(c.n));
const fireOK=ORDER.every((n,k)=>Math.abs(mod((CY[n-1].beta-CY[n-1].pin)/D,360)-mod(90*k,360))<1e-6)&&Object.values(pairs).every(p=>p.length===2&&p[0]%2!==p[1]%2);
document.getElementById('chk').textContent=`${(8*M.Vd/1e6).toFixed(2)} L · CR ${M.cr}:1 · ${M.bore}×${M.stroke} mm · rod ${M.rod} mm · 90° firing ${fireOK?'✓':'✗'}`;

/* ===== SCENE ===== */
const U=.01,cv=document.getElementById('gl');
let R=null, scene=null, cam=null, webglOK=false;
try {
  // Ensure canvas has size before context creation (helps some GPUs)
  cv.width = cv.clientWidth || innerWidth;
  cv.height = cv.clientHeight || innerHeight;
  R = new THREE.WebGLRenderer({
    canvas: cv,
    antialias: true,
    alpha: false,
    powerPreference: 'high-performance',
    failIfMajorPerformanceCaveat: false,
    preserveDrawingBuffer: false
  });
  R.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  R.setSize(innerWidth, innerHeight, false);
  R.shadowMap.enabled = true;
  R.shadowMap.type = THREE.PCFSoftShadowMap;
  R.localClippingEnabled = true;
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xeceef1);
  cam = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, .1, 200);
  webglOK = true;
} catch (err) {
  console.error('WebGL init failed:', err);
  const msg = document.createElement('div');
  msg.id = 'webgl-fail';
  msg.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#eceef1;color:#15181d;font:14px/1.5 system-ui;text-align:center;padding:24px;z-index:5;pointer-events:none';
  msg.innerHTML = '<div style="font-size:18px;font-weight:700;margin-bottom:8px">3D view unavailable</div><div style="max-width:380px;color:#6b7482">WebGL could not start on this browser/device.<br>Turn on hardware acceleration, update GPU drivers, or try Chrome / Edge.</div>';
  document.body.appendChild(msg);
}

// Stubs so the rest of the script never throws when WebGL is missing
if (!webglOK) {
  const noop = ()=>{};
  const meshStub = { position:{set:noop,y:0}, rotation:{z:0}, scale:{set:noop,y:1}, visible:true, material:{emissive:{setHex:noop}, color:{setHex:noop}, opacity:1, emissiveIntensity:0}, castShadow:false };
  scene = { add:noop, traverse:noop, background:null };
  cam = { position:{set:noop}, lookAt:noop, aspect:1, updateProjectionMatrix:noop };
  R = { setSize:noop, render:noop, shadowMap:{}, localClippingEnabled:false };
}
scene.add(new THREE.HemisphereLight(0xffffff,0x9aa3b0,.95));
const dl=new THREE.DirectionalLight(0xffffff,.85);dl.position.set(5,12,7);dl.castShadow=true;dl.shadow.mapSize.set(2048,2048);Object.assign(dl.shadow.camera,{left:-9,right:9,top:9,bottom:-9,near:1,far:40});dl.shadow.bias=-.0004;scene.add(dl);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.ShadowMaterial({opacity:.16}));fl.rotation.x=-Math.PI/2;fl.position.y=-2.1;fl.receiveShadow=true;scene.add(fl);
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,metalness:.5,roughness:.45},o));
const blk=0x15181d,steel=mat(0xc3c9d2,{metalness:.8,roughness:.3}),dk=mat(0x1d2025),white=mat(0xe9edf2,{metalness:.3,roughness:.35}),rodM=mat(0x7e8794,{metalness:.7}),gearM=mat(0x23272e,{metalness:.6});
const shell=[],sh=(c,o)=>{const m=mat(c,Object.assign({transparent:true,opacity:.22,depthWrite:false},o));shell.push(m);return m};
const clipP=new THREE.Plane(new THREE.Vector3(0,0,-1),0);
const box=(w,h,d,m,x,y,z,p)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);b.position.set(x,y,z);(p||scene).add(b);return b};
const cylZ=(r,l,m,x,y,z,p,seg)=>{const c=new THREE.Mesh(new THREE.CylinderGeometry(r,r,l,seg||32),m);c.rotation.x=Math.PI/2;c.position.set(x,y,z);(p||scene).add(c);return c};
function gear(T,r,t,m){const s=new THREE.Shape(),n=T*4,k=[.9,1,1,.9];for(let i=0;i<n;i++){const a=i/n*6.2832,q=r*k[i%4];i?s.lineTo(q*Math.cos(a),q*Math.sin(a)):s.moveTo(q*Math.cos(a),q*Math.sin(a))}
const g=new THREE.ExtrudeGeometry(s,{depth:t,bevelEnabled:false});g.translate(0,0,-t/2);return new THREE.Mesh(g,m)}
function spring(){const p=[];for(let i=0;i<=96;i++){const a=i/96*6.2832*8;p.push(new THREE.Vector3(.13*Math.cos(a),i/96,.13*Math.sin(a)))}return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(p),96,.014,5),steel)}
const deck=(M.rod+M.r)*U+.4+(M.Vc/M.A)*U,rr=M.r*U,Lr=M.rod*U,CAMY=1.44;
/* block, heads, crankcase, manifold */
box(2.7,1.5,5.7,sh(blk),0,-.35,0);box(2.3,.5,5.5,sh(0x2a2f37),0,-1.3,0);box(1.1,.5,5.2,sh(0x7d8794,{opacity:.5}),0,2.35,0);
[45,-45].forEach(b=>{const g=new THREE.Group();g.rotation.z=-b*D;scene.add(g);box(1.75,1.5,5.6,sh(blk),0,deck-.75,0,g);box(1.8,.7,5.6,sh(0x242830,{opacity:.55}),0,deck+.35,0,g)});
/* crankshaft + gears */
const crank=new THREE.Group();scene.add(crank);cylZ(.22,8,steel,0,0,0,crank);
PINS.forEach((p,i)=>{const pv=new THREE.Group();pv.position.z=ZS[i];pv.rotation.z=-p*D;crank.add(pv);
for(const x of[-.38,.38]){const w=box(.8,1.25,.12,steel,0,.2,x,pv);const cw=box(1.0,.85,.12,dk,0,-.75,x,pv)}cylZ(.2,.64,steel,0,rr,0,pv)});
const fw=gear(72,1.12,.3,gearM);fw.position.z=3.75;crank.add(fw);cylZ(.9,.34,dk,0,0,3.75,crank);
const cg=gear(24,.48,.32,gearM);cg.position.z=-3.55;crank.add(cg);cylZ(.62,.5,dk,0,0,-4.1,crank);
const camG=new THREE.Group();camG.position.set(0,CAMY,0);scene.add(camG);cylZ(.18,7.4,steel,0,0,0,camG);
const cmg=gear(48,.96,.3,gearM);cmg.position.z=-3.55;camG.add(cmg);
/* cylinders */
const gasGeo=new THREE.CylinderGeometry(M.bore/200,M.bore/200,1,24),pr=M.bore/200;
const COLS=[0xff5a32,0x8a94a3,0x3aa8ff,0xff9a3c],NAMES=['Power','Exhaust','Intake','Compression'];
CY.forEach(c=>{const g=new THREE.Group();g.position.z=c.z;g.rotation.z=-c.beta;scene.add(g);c.g=g;c.parts=[];
const liner=new THREE.Mesh(new THREE.CylinderGeometry(pr+.05,pr+.05,1.35,32,1,true),sh(0xaad4ff,{opacity:.18,metalness:.1,roughness:.1,side:THREE.DoubleSide}));liner.position.y=deck-.675;g.add(liner);
c.gm=new THREE.MeshStandardMaterial({transparent:true,opacity:.7,color:0x3aa8ff,emissive:0x000000});c.gas=new THREE.Mesh(gasGeo,c.gm);g.add(c.gas);
c.pis=new THREE.Group();g.add(c.pis);const crown=new THREE.Mesh(new THREE.CylinderGeometry(pr-.02,pr-.02,.6,32),white);crown.position.y=.1;c.pis.add(crown);
for(const y of[.28,.2]){const rg=new THREE.Mesh(new THREE.TorusGeometry(pr-.02,.012,6,28),dk);rg.rotation.x=Math.PI/2;rg.position.y=y;c.pis.add(rg)}cylZ(.07,.72,steel,0,0,0,c.pis);
c.rod=new THREE.Mesh(new THREE.BoxGeometry(.13,1,.17),rodM);scene.add(c.rod);
c.plug=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.7,10),new THREE.MeshStandardMaterial({color:0xf0f0f0,emissive:0x000000}));c.plug.position.set(0,deck+.55,0);g.add(c.plug);
const s=-Math.sign(c.beta);c.vs=[[s,350,IV,475,'iv'],[-s,130,EV,255,'ev']].map(([sg,o,t,pk])=>{
const v=new THREE.Group();v.position.x=sg*.2;g.add(v);const st=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.9,8),steel);st.position.y=.45;v.add(st);
const hd=new THREE.Mesh(new THREE.CylinderGeometry(.17,.17,.03,20),white);v.add(hd);
const sp=spring();sp.position.set(sg*.2,deck+.1,0);g.add(sp);
const pv=new THREE.Group();pv.position.set(sg*.5,deck+.9,0);g.add(pv);box(.8,.08,.14,dk,0,0,0,pv);box(.1,.35,.14,dk,0,-.2,0,pv);
const pu=new THREE.Mesh(new THREE.CylinderGeometry(.022,.022,2.1,6),steel);pu.position.set(sg*.68,deck-.15,0);g.add(pu);
const lf=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.3,12),dk);lf.position.set(sg*.68,deck-1.3,0);g.add(lf);
const lx=sg*.68,ly=deck-1.2,wx=Math.cos(c.beta)*lx+Math.sin(c.beta)*ly,wy=-Math.sin(c.beta)*lx+Math.cos(c.beta)*ly,gam=Math.atan2(wx,wy-CAMY);
const lg=new THREE.Group();lg.position.z=c.z;lg.rotation.z=-(gam+(pk+90*c.k)*D/2);camG.add(lg);
const lb=cylZ(.25,.2,gearM,0,0,0,lg,24);lb.scale.z=1.7;lb.position.y=0;
c.parts.push(v,sp,pv,pu,lf,lg);return{sg,v,sp,pv,pu,lf,t:o,d:t[1]}});c.parts.push(c.g,c.rod)});
scene.traverse(o=>{if(o.isMesh&&o!==fl)o.castShadow=true});
/* camera */
let az=.8,el=.35,dist=13,tgt=new THREE.Vector3(0,.4,0);
const VIEWS={hero:[.8,.35,13],front:[0,0,13],side:[Math.PI/2,0,13],valley:[.35,1.0,11]};
function placeCam(){if(!webglOK)return;cam.position.set(tgt.x+dist*Math.cos(el)*Math.sin(az),tgt.y+dist*Math.sin(el),tgt.z+dist*Math.cos(el)*Math.cos(az));cam.lookAt(tgt)}
const $=id=>document.getElementById(id),q=s=>[...document.querySelectorAll(s)];
function view(v){q('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));if(v==='cyl'){const c=CY[track];tgt.set(Math.sin(c.beta)*1.6,Math.cos(c.beta)*1.6,c.z);az=.6;el=.15;dist=5.5}else{tgt.set(0,.4,0);[az,el,dist]=VIEWS[v];if(innerWidth<innerHeight)dist*=1.35}placeCam()}
q('[data-v]').forEach(b=>b.onclick=()=>view(b.dataset.v));
const pts=new Map();
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY])});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const o=pts.get(e.pointerId);
if(pts.size===1){az-=(e.clientX-o[0])*.008;el=Math.max(-1.45,Math.min(1.5,el+(e.clientY-o[1])*.008))}
else{const r=[...pts.entries()].find(([i])=>i!==e.pointerId)[1],d0=Math.hypot(o[0]-r[0],o[1]-r[1]),d1=Math.hypot(e.clientX-r[0],e.clientY-r[1]);dist=Math.max(3,Math.min(30,dist*d0/d1))}
pts.set(e.pointerId,[e.clientX,e.clientY]);placeCam()});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,e=>pts.delete(e.pointerId)));
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(3,Math.min(30,dist*(1+e.deltaY*.001)));placeCam()},{passive:false});
function resize(){if(webglOK){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();placeCam()}}
addEventListener('resize',resize);
/* UI state */
let track=0,th=0,run=true,thr=.7,curve=[];
const chips=$('chips');ORDER.forEach(n=>{const b=document.createElement('button');b.textContent=n;b.dataset.n=n;b.onclick=()=>{track=n-1;sel();if(iso)isolate()};chips.appendChild(b)});
const sel=()=>{[...chips.children].forEach(b=>b.classList.toggle('on',+b.dataset.n===track+1));$('trk').textContent='Cylinder '+(track+1)+' · '+((track+1)%2?'right':'left')+' bank'};sel();
function buildCurve(){
  curve = [];
  var ph = 0;
  while (ph <= 720) {
    var a = (ph % 360) * D;
    curve.push([xOf(a), pOf(ph, xOf(a), thr), ph]);
    ph += 4;
  }
}
buildCurve();
$('th').oninput=e=>{thr=+e.target.value;buildCurve()};$('pb').oninput=e=>$('pbv').textContent=e.target.value;
const setRun=r=>{run=r;$('pz').textContent=run?'Pause':'Play';$('pz').classList.toggle('on',run)};$('pz').onclick=()=>setRun(!run);
$('m15').onclick=()=>{setRun(false);th=mod(th-15,720)};$('p15').onclick=()=>{setRun(false);th=mod(th+15,720)};
let iso=false;function isolate(){CY.forEach((c,i)=>{const v=!iso||i===track;c.g.visible=c.rod.visible=v});}
$('iso').onclick=e=>{iso=!iso;e.target.classList.toggle('on',iso);isolate()};
let chg=true;$('chg').onclick=e=>{chg=!chg;e.target.classList.toggle('on',chg);CY.forEach(c=>c.gas.visible=chg)};
$('pnl').onclick=e=>{e.target.classList.toggle('on');$('strip').classList.toggle('off')};
q('[data-m]').forEach(b=>b.onclick=()=>{q('[data-m]').forEach(x=>x.classList.toggle('on',x===b));const m=b.dataset.m;
shell.forEach(s=>{const liner=s.side===THREE.DoubleSide;s.transparent=m==='glass'||liner;s.depthWrite=!(m==='glass'||liner);s.opacity=liner?(m==='glass'?.18:.1):(m==='glass'?.22:1);s.clippingPlanes=m==='section'?[clipP]:[];s.needsUpdate=true})});
/* 2D panels */
const ctx=id=>{const c=$(id);return[c.getContext('2d'),c.width,c.height]},css=n=>'#'+n.toString(16).padStart(6,'0');
const [vx,vw,vh]=ctx('vt'),[px,pw,ph_]=ctx('pv'),[sx,sw,sh_]=ctx('sc'),[cx,cw,ch]=ctx('cp');
const line=(c,x1,y1,x2,y2,col,w)=>{c.strokeStyle=col;c.lineWidth=w||2;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()};
const dot=(c,x,y,r,col)=>{c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill()};
function drawVT(ph){vx.clearRect(0,0,vw,vh);[[0,'POWER'],[180,'EXH'],[360,'INTAKE'],[540,'COMP']].forEach(([p,t],i)=>{const x=p/720*vw;line(vx,x,0,x,vh,'#e3e6ea',1);vx.fillStyle='#8a93a0';vx.font='16px system-ui';vx.fillText(t,x+4,16)});
for(const [o,d,col] of[[IV[0],IV[1],'#3aa8ff'],[EV[0],EV[1],'#ff9a3c']]){vx.strokeStyle=col;vx.lineWidth=3;vx.beginPath();for(let p=0;p<=720;p+=6){const x=p/720*vw,y=vh-12-lift(p,o,d)*(vh-40);p?vx.lineTo(x,y):vx.moveTo(x,y)}vx.stroke()}
line(vx,ph/720*vw,0,ph/720*vw,vh,'#e0262f',2.5)}
const vt=$('vt');let drag=false;const scrub=e=>{const r=vt.getBoundingClientRect(),ph=Math.max(0,Math.min(719,(e.clientX-r.left)/r.width*720));setRun(false);th=mod(ph+90*CY[track].k,720)};
vt.onpointerdown=e=>{drag=true;vt.setPointerCapture(e.pointerId);scrub(e)};vt.onpointermove=e=>{if(drag)scrub(e)};vt.onpointerup=()=>drag=false;
function drawPV(x,p){const pm=Math.max(...curve.map(c=>c[1]))*1.05,X=v=>14+(1-v/M.stroke)*(pw-28),Y=v=>ph_-14-v/pm*(ph_-28);px.clearRect(0,0,pw,ph_);
line(px,14,6,14,ph_-14,'#9aa3b0',1.5);line(px,14,ph_-14,pw-6,ph_-14,'#9aa3b0',1.5);
for(let i=1;i<curve.length;i++){px.strokeStyle=css(COLS[Math.floor(curve[i][2]/180)%4]);px.lineWidth=3;px.beginPath();px.moveTo(X(curve[i-1][0]),Y(curve[i-1][1]));px.lineTo(X(curve[i][0]),Y(curve[i][1]));px.stroke()}
dot(px,X(x),Y(p),7,'#fff');px.strokeStyle='#e0262f';px.lineWidth=3;px.beginPath();px.arc(X(x),Y(p),7,0,7);px.stroke()}
function drawSC(s){sx.clearRect(0,0,sw,sh_);const k=1.1,cx0=50,cy0=sh_/2,r=M.r*k,L=M.rod*k*.55,a=s.a,pxp=cx0+r*Math.cos(a),pyp=cy0-r*Math.sin(a),xs=cx0+(s.s/M.rod)*L;
sx.strokeStyle='#9aa3b0';sx.lineWidth=2;sx.beginPath();sx.arc(cx0,cy0,r,0,7);sx.stroke();line(sx,cx0,cy0,pxp,pyp,'#15181d',4);
line(sx,pxp,pyp,xs,cy0,'#7e8794',4);sx.fillStyle='#e0262f';sx.fillRect(xs,cy0-26,24,52);dot(sx,cx0,cy0,6,'#15181d');dot(sx,pxp,pyp,6,'#fff');
sx.fillStyle='#6b7482';sx.font='15px system-ui';sx.fillText('r '+(M.r/10).toFixed(1)+' cm · L '+(M.rod/10).toFixed(1)+' cm · stroke '+M.stroke+' mm',8,sh_-8);$('ang').textContent=Math.round(mod(s.ph,360))+'° ATDC'}
function drawCP(){cx.clearRect(0,0,cw,ch);const X=cw/2-20,Y=ch/2,R_=62;cx.strokeStyle='#cfd4db';cx.lineWidth=2;cx.beginPath();cx.arc(X,Y,R_,0,7);cx.stroke();
line(cx,X,Y,X+R_*Math.sin(th*D),Y-R_*Math.cos(th*D),'#b4bac4',2);const act=CY[track].zi;
PINS.forEach((p,i)=>{const x=X+R_*Math.sin(p*D),y=Y-R_*Math.cos(p*D);dot(cx,x,y,i===act?13:9,i===act?'#e0262f':'#15181d');cx.fillStyle='#6b7482';cx.font='15px system-ui';cx.fillText(pairs[i].join('-'),x+(x>X?14:-44),y+5)});dot(cx,X,Y,5,'#15181d')}
/* frame */
const rpmEl=$('rpm'),stk=$('stk'),pp=$('pp');let last=performance.now();
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;const rpm=+$('sp').value,N=+$('pb').value;if(run)th=mod(th+rpm*6/N*dt,720);rpmEl.textContent=rpm;
crank.rotation.z=-th*D;camG.rotation.z=th*D/2;
for(const c of CY){const s=state(th,c,thr),yp=s.s*U;c.pis.position.y=yp;
const h=(M.Vc/M.A+s.x)*U;c.gas.scale.set(1,h,1);c.gas.position.y=yp+.4+h/2;
const si=Math.floor(s.ph/180),burn=s.ph<70?1-s.ph/70:0;c.gm.color.setHex(si===1?0x6b7380:COLS[si]);c.gm.emissive.setHex(COLS[0]);c.gm.emissiveIntensity=burn*1.5;c.gm.opacity=.4+.45*Math.min(1,s.p/60);
const sp=s.ph>706||s.ph<5;c.plug.material.emissive.setHex(sp?0x66aaff:0);
[s.iv,s.ev].forEach((lf,i)=>{const w=c.vs[i],L=lf*.1,dl_=L/.3;w.v.position.y=deck-L;w.sp.scale.y=(.7-L)/.7;w.pv.rotation.z=w.sg*dl_;w.pu.position.y=deck-.15+.18*dl_;w.lf.position.y=deck-1.3+.18*dl_});
const P=[rr*Math.sin(s.psi),rr*Math.cos(s.psi)],Q=[Math.sin(c.beta)*yp,Math.cos(c.beta)*yp],dx=Q[0]-P[0],dy=Q[1]-P[1];
c.rod.position.set((P[0]+Q[0])/2,(P[1]+Q[1])/2,c.z);c.rod.scale.y=Math.hypot(dx,dy);c.rod.rotation.z=-Math.atan2(dx,dy)}
const ts=state(th,CY[track],thr),si=Math.floor(ts.ph/180);stk.textContent=NAMES[si];stk.style.color=css(si===1?0x6b7380:COLS[si]);pp.textContent=ts.p.toFixed(1);
[...chips.children].forEach(b=>{const s=state(th,CY[+b.dataset.n-1],thr);b.style.outline=s.ph<90?'2px solid #e0262f':'none'});
drawVT(ts.ph);drawPV(ts.x,ts.p);drawSC(ts);drawCP();R.render(scene,cam);requestAnimationFrame(frame)}
resize();view('hero');requestAnimationFrame(frame);
